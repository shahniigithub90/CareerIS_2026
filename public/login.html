<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CareerIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#050816;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}
        #particles{position:fixed;inset:0;z-index:0;pointer-events:none;}

        /* Orbs */
        .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;animation:orbFloat 8s ease-in-out infinite;}
        .orb1{width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,0.2) 0%,transparent 70%);top:-200px;right:-150px;}
        .orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(59,130,246,0.15) 0%,transparent 70%);bottom:-100px;left:-100px;animation-delay:4s;}
        @keyframes orbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-25px);}}

        /* Layout */
        .page-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 16px 40px;position:relative;z-index:1;}

        /* Card */
        .auth-card{background:rgba(12,15,30,0.85);border:1px solid rgba(124,58,237,0.2);border-radius:24px;
            padding:44px 40px;width:100%;max-width:440px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            box-shadow:0 40px 80px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
            animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;}
        @keyframes slideUp{from{opacity:0;transform:translateY(32px);}to{opacity:1;transform:translateY(0);}}

        /* Brand */
        .auth-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px;}
        .brand-icon{width:44px;height:44px;background:linear-gradient(135deg,#7C3AED,#3B82F6);border-radius:12px;
            display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(124,58,237,0.4);}
        .brand-icon i{color:#fff;font-size:1.2rem;}
        .brand-name{font-size:1.6rem;font-weight:900;letter-spacing:-0.5px;}
        .brand-career{color:#fff;}.brand-is{background:linear-gradient(135deg,#7C3AED,#60A5FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

        .auth-title{font-size:1.5rem;font-weight:800;color:#fff;text-align:center;margin-bottom:6px;letter-spacing:-0.5px;}
        .auth-sub{font-size:0.85rem;color:rgba(255,255,255,0.4);text-align:center;margin-bottom:32px;}

        /* Form */
        .form-group{margin-bottom:18px;}
        label{display:block;font-size:0.78rem;font-weight:600;color:rgba(255,255,255,0.6);margin-bottom:6px;letter-spacing:0.3px;}
        .input-wrap{position:relative;}
        .input-wrap > i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.25);font-size:0.85rem;pointer-events:none;transition:color 0.2s;}
        .form-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;padding:12px 14px 12px 40px;color:#fff;font-size:0.9rem;font-family:'Inter',sans-serif;
            transition:all 0.25s;outline:none;}
        .form-input:focus{border-color:rgba(124,58,237,0.5);background:rgba(124,58,237,0.06);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
        .form-input:focus + i,.input-wrap:focus-within i{color:#a78bfa;}
        .form-input::placeholder{color:rgba(255,255,255,0.2);}
        .form-input.error-field{border-color:rgba(239,68,68,0.5);}

        /* Password toggle */
        .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;
            color:rgba(255,255,255,0.25);cursor:pointer;padding:4px;transition:color 0.2s;}
        .eye-btn:hover{color:rgba(255,255,255,0.6);}

        /* Forgot */
        .forgot-link{font-size:0.78rem;color:#a78bfa;text-decoration:none;float:right;margin-top:-14px;margin-bottom:18px;transition:color 0.2s;}
        .forgot-link:hover{color:#c4b5fd;}

        /* Button */
        .btn-auth{width:100%;padding:13px;background:linear-gradient(135deg,#7C3AED,#3B82F6);color:#fff;
            font-weight:700;font-size:0.95rem;border:none;border-radius:12px;cursor:pointer;
            transition:all 0.3s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;
            box-shadow:0 6px 24px rgba(124,58,237,0.4);}
        .btn-auth:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(124,58,237,0.6);}
        .btn-auth:active{transform:translateY(0);}
        .btn-auth:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

        /* Divider */
        .divider{display:flex;align-items:center;gap:12px;margin:24px 0;}
        .divider span{font-size:0.75rem;color:rgba(255,255,255,0.25);}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}


        /* Alert */
        .auth-alert{padding:12px 16px;border-radius:10px;font-size:0.82rem;margin-bottom:16px;display:none;align-items:center;gap:8px;}
        .auth-alert.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;}
        .auth-alert.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}

        /* Links */
        .auth-footer{text-align:center;margin-top:24px;font-size:0.83rem;color:rgba(255,255,255,0.4);}
        .auth-footer a{color:#a78bfa;text-decoration:none;font-weight:600;transition:color 0.2s;}
        .auth-footer a:hover{color:#c4b5fd;}

        /* Top nav bar */
        .top-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 24px;
            display:flex;align-items:center;background:rgba(5,8,22,0.6);backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(124,58,237,0.1);}
        .back-home{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.4);
            font-size:0.8rem;font-weight:500;text-decoration:none;transition:color 0.2s;}
        .back-home:hover{color:#a78bfa;}

        /* Spinner */
        .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
    </style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Top bar -->
<div class="top-bar">
    <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div style="margin-left:auto;font-size:0.75rem;color:rgba(255,255,255,0.2);">Jinnah University for Women</div>
</div>

<div class="page-wrap">
    <div class="auth-card">
        <!-- Brand -->
        <div class="auth-brand">
            <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <div class="brand-name"><span class="brand-career">Career</span><span class="brand-is">IS</span></div>
        </div>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to your CareerIS account</p>

        <!-- Alert -->
        <div class="auth-alert error" id="alertBox"><i class="fas fa-exclamation-circle"></i><span id="alertMsg"></span></div>

        <form id="loginForm" novalidate autocomplete="off">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <input type="text" id="email" name="careeris-email" class="form-input" placeholder="Enter your email" required autocomplete="off">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="careeris-pass" class="form-input" placeholder="Enter your password" required autocomplete="new-password" style="padding-right:42px;">
                    <i class="fas fa-lock"></i>
                    <button type="button" class="eye-btn" onclick="togglePwd()"><i class="fas fa-eye" id="eyeIcon"></i></button>
                </div>
            </div>

            <div style="clear:both;">
                <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-auth" id="submitBtn">
                <span id="btnText">Sign In</span>
                <div class="spinner" id="btnSpinner" style="display:none;"></div>
            </button>
        </form>

        <div class="divider"><span>New to CareerIS?</span></div>

        <div class="auth-footer">
            Don't have an account? <a href="/register.html">Create one free</a>
        </div>
    </div>
</div>

<script>
// ── Particles ──
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
let pts=[];
for(let i=0;i<60;i++)pts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()+0.3,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,a:Math.random()*.4+.1});
(function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(124,58,237,${p.a})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1;});requestAnimationFrame(draw);})();

// ── Password toggle ──
function togglePwd(){
    const inp = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if(inp.type==='password'){inp.type='text';icon.className='fas fa-eye';}
    else{inp.type='password';icon.className='fas fa-eye-slash';}
}

// ── Alert ──
function showAlert(msg,type='error'){
    const box=document.getElementById('alertBox');
    const span=document.getElementById('alertMsg');
    span.textContent=msg;
    box.className=`auth-alert ${type}`;
    box.style.display='flex';
}
function hideAlert(){document.getElementById('alertBox').style.display='none';}

// ── Login ──
document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    hideAlert();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email||!password){showAlert('Please fill in all fields.');return;}

    const btn  = document.getElementById('submitBtn');
    const txt  = document.getElementById('btnText');
    const spin = document.getElementById('btnSpinner');
    btn.disabled=true; txt.textContent='Signing in…'; spin.style.display='block';

    try {
        const res  = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
            showAlert(data.message || 'Invalid email or password.');
            btn.disabled=false; txt.textContent='Sign In'; spin.style.display='none';
            return;
        }

        localStorage.setItem('careeris_token', data.token);
        localStorage.setItem('careeris_user',  JSON.stringify(data.user));

        showAlert('Login successful! Redirecting…', 'success');

        setTimeout(() => {
            const role = data.user?.role || currentRole;
            if(role==='admin')       location.href='/dashboard/admin.html';
            else if(role==='alumni') location.href='/dashboard/alumni.html';
            else                     location.href='/dashboard/student.html';
        }, 800);

    } catch(err) {
        showAlert('Network error. Please try again.');
        btn.disabled=false; txt.textContent='Sign In'; spin.style.display='none';
    }
});

// ── Clear autofill ──
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
    }, 100);
});

</script>
</body>
</html>
