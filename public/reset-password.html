<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CareerIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#0a0d14; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }

        /* Navbar */
        #mainNav {
            position:fixed; top:0; left:0; right:0; z-index:100;
            background:#0d1117 !important;
            border-bottom:1px solid rgba(255,255,255,0.07);
            padding:14px 40px; display:flex; align-items:center; justify-content:space-between;
        }
        .nav-logo { font-size:1.3rem; font-weight:700; text-decoration:none; }
        .nav-logo .c { color:#fff; } .nav-logo .is { color:#6c5ce7; }
        .btn-nav-home { background:rgba(255,255,255,0.07); color:#d1d5db; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:7px 16px; font-size:0.83rem; text-decoration:none; transition:all 0.2s; }
        .btn-nav-home:hover { background:rgba(255,255,255,0.12); color:#fff; }

        /* Card */
        .auth-card {
            background:#1a1d27; border:1px solid rgba(255,255,255,0.08);
            border-radius:20px; padding:2.5rem; width:100%; max-width:440px;
            margin-top:70px; box-shadow:0 20px 60px rgba(0,0,0,0.4);
        }
        .auth-icon { width:64px; height:64px; background:linear-gradient(135deg,#6c5ce7,#a29bfe); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 1.25rem; }
        h2 { color:#f0f2f5; font-size:1.4rem; font-weight:700; text-align:center; margin-bottom:0.4rem; }
        .subtitle { color:#9ba3af; font-size:0.85rem; text-align:center; margin-bottom:1.75rem; }
        .form-label { color:#9ba3af; font-size:0.82rem; font-weight:600; margin-bottom:6px; display:block; }
        .form-control {
            background:#252840 !important; border:1px solid rgba(255,255,255,0.1) !important;
            color:#f0f2f5 !important; border-radius:10px !important; padding:11px 14px !important;
            font-size:0.9rem; font-family:'Poppins',sans-serif;
        }
        .form-control:focus { border-color:#6c5ce7 !important; box-shadow:0 0 0 3px rgba(108,92,231,0.2) !important; }
        .form-control::placeholder { color:#6b7280 !important; }
        .btn-submit {
            width:100%; padding:13px; background:linear-gradient(135deg,#6c5ce7,#4834d4);
            color:#fff; border:none; border-radius:10px; font-size:0.95rem; font-weight:600;
            cursor:pointer; font-family:'Poppins',sans-serif; transition:all 0.2s; margin-top:0.5rem;
        }
        .btn-submit:hover { opacity:0.9; transform:translateY(-1px); }
        .btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .msg { border-radius:10px; padding:12px 16px; font-size:0.85rem; margin-bottom:1rem; display:none; }
        .msg.success { background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); color:#10b981; }
        .msg.error   { background:rgba(239,68,68,0.12);  border:1px solid rgba(239,68,68,0.3);  color:#ef4444; }
        .pw-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#9ba3af; cursor:pointer; padding:4px; }
        .back-link { text-align:center; margin-top:1.25rem; font-size:0.83rem; color:#9ba3af; }
        .back-link a { color:#6c5ce7; text-decoration:none; font-weight:600; }
        .back-link a:hover { text-decoration:underline; }
        .strength-bar { height:4px; border-radius:2px; margin-top:6px; background:#2d3148; overflow:hidden; }
        .strength-fill { height:100%; border-radius:2px; width:0; transition:all 0.3s; }

        /* Expired / invalid state */
        #invalidSection { display:none; text-align:center; }
        #invalidSection i { font-size:3rem; color:#ef4444; margin-bottom:1rem; display:block; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav id="mainNav">
    <a href="index.html" class="nav-logo"><span class="c">Career</span><span class="is">IS</span></a>
    <a href="login.html" class="btn-nav-home"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
</nav>

<div class="auth-card">
    <div class="auth-icon">🔐</div>
    <h2>Set New Password</h2>
    <p class="subtitle">Enter a strong new password for your account.</p>

    <div id="alertMsg" class="msg"></div>

    <!-- Valid token form -->
    <div id="resetForm">
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <div style="position:relative;">
                <input type="password" class="form-control" id="newPassword" placeholder="At least 6 characters" oninput="checkStrength()">
                <button class="pw-toggle" type="button" onclick="togglePw('newPassword',this)"><i class="fas fa-eye"></i></button>
            </div>
            <div class="strength-bar mt-2"><div class="strength-fill" id="strengthFill"></div></div>
            <div id="strengthLabel" style="font-size:0.74rem;color:#9ba3af;margin-top:3px;"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <div style="position:relative;">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password">
                <button class="pw-toggle" type="button" onclick="togglePw('confirmPassword',this)"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <button class="btn-submit" id="resetBtn" onclick="doReset()">
            <i class="fas fa-lock me-2"></i>Reset Password
        </button>
    </div>

    <!-- Invalid / expired token -->
    <div id="invalidSection">
        <i class="fas fa-exclamation-circle"></i>
        <p style="color:#9ba3af;margin-bottom:1.25rem;">This reset link is <strong style="color:#ef4444;">invalid or expired</strong>. Reset links are only valid for 15 minutes.</p>
        <a href="login.html" style="display:inline-block;background:linear-gradient(135deg,#6c5ce7,#4834d4);color:#fff;padding:11px 28px;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;">Request New Link</a>
    </div>

    <div class="back-link">
        Remembered your password? <a href="login.html">Sign in</a>
    </div>
</div>

<script>
    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('invalidSection').style.display = 'block';
        document.querySelector('.subtitle').style.display = 'none';
    }

    function togglePw(id, btn) {
        const inp = document.getElementById(id);
        const isText = inp.type === 'text';
        inp.type = isText ? 'password' : 'text';
        btn.innerHTML = `<i class="fas fa-eye${isText ? '-slash' : ''}"></i>`;
    }

    function checkStrength() {
        const pw = document.getElementById('newPassword').value;
        const fill = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        let score = 0;
        if (pw.length >= 6)  score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        const levels = [
            { w:'0%',   color:'#2d3148', text:'' },
            { w:'25%',  color:'#ef4444', text:'Weak' },
            { w:'50%',  color:'#f59e0b', text:'Fair' },
            { w:'75%',  color:'#3b82f6', text:'Good' },
            { w:'100%', color:'#10b981', text:'Strong' },
        ];
        const lvl = levels[Math.min(score, 4)];
        fill.style.width = lvl.w;
        fill.style.background = lvl.color;
        label.textContent = lvl.text;
        label.style.color = lvl.color;
    }

    function showMsg(text, type) {
        const el = document.getElementById('alertMsg');
        el.textContent = text;
        el.className = `msg ${type}`;
        el.style.display = 'block';
    }

    async function doReset() {
        const password = document.getElementById('newPassword').value.trim();
        const confirm  = document.getElementById('confirmPassword').value.trim();
        const btn      = document.getElementById('resetBtn');

        if (!password || password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
        if (password !== confirm) { showMsg('Passwords do not match.', 'error'); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Resetting...';

        try {
            const res  = await fetch('/api/auth/reset-password', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ token, password })
            });
            const data = await res.json();

            if (data.success) {
                showMsg('✅ ' + data.message, 'success');
                document.getElementById('resetForm').style.display = 'none';
                document.querySelector('.subtitle').textContent = 'All done! Redirecting you to login...';
                setTimeout(() => { window.location.href = 'login.html'; }, 2500);
            } else {
                showMsg(data.message, 'error');
                if (data.message.includes('invalid') || data.message.includes('expired')) {
                    document.getElementById('resetForm').style.display = 'none';
                    document.getElementById('invalidSection').style.display = 'block';
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock me-2"></i>Reset Password';
            }
        } catch (err) {
            showMsg('Something went wrong. Please try again.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock me-2"></i>Reset Password';
        }
    }
</script>
</body>
</html>
